<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{board/layout/layout.html}"
>
  <head>
    <title>register</title>
  </head>
  <body>
    <th:block layout:fragment="content">
      <div class="row justify-content-center">
        <div class="col-lg-12">
          <div class="card shadow mb-4">
            <div class="card-header py-3">
              <h6 class="m-0 fw-bold text-primary">Board Modify</h6>
            </div>

            <div class="card-body">
              <form id="actionForm" action="/board/modify" method="post"></form>
              <div class="float-end">
                <button type="button" class="btn btn-info btnList">LIST</button>
                <button type="button" class="btn btn-warning btnModify">MODIFY</button>
                <button type="button" class="btn btn-danger btnRemove">REMOVE</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </th:block>

    <th:block layout:fragment="script">
      <script type="text/javascript">
        const formObj = document.querySelector("#actionForm");

        document.querySelector(".btnModify").addEventListener(
          "click",
          () => {
            formObj.action = "/board/modify";
            formObj.method = "post";
            formObj.submit();
          },
          false
        );

        document.querySelector(".btnList").addEventListener(
          "click",
          () => {
            formObj.action = "/board/list";
            formObj.method = "get";
            formObj.submit();
          },
          false
        );

        document.querySelector(".btnRemove").addEventListener(
          "click",
          () => {
            formObj.action = "/board/remove";
            formObj.method = "post";
            formObj.submit();
          },
          false
        );
      </script>
    </th:block>
  </body>
</html>
