<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{board/layout/layout.html}"
>
  <head>
    <title>read</title>
  </head>
  <body>
    <th:block layout:fragment="content">
      <div class="row justify-content-center">
        <div class="col-lg-12">
          <div class="card shadow mb-4">
            <div class="card-header py-3">
              <h6 class="m-0 fw-bold text-primary">Board Read</h6>
            </div>

            <div class="card-body">
              <div class="mb-3 input-group input-group-lg">
                <span class="input-group-text">Bno</span>
                <input
                  type="text"
                  class="form-control"
                  th:value="${board.bno}"
                  aria-label="Bno"
                  readonly
                />
              </div>

              <div class="mb-3 input-group input-group-lg">
                <span class="input-group-text">Title</span>
                <input
                  type="text"
                  name="title"
                  class="form-control"
                  th:value="${board.title}"
                  aria-label="Title"
                  readonly
                />
              </div>

              <div class="mb-3 input-group input-group-lg">
                <span class="input-group-text">Content</span>
                <textarea
                  class="form-control"
                  name="content"
                  rows="3"
                  th:text="${board.content}"
                  aria-label="Content"
                  readonly
                ></textarea>
              </div>

              <div class="mb-3 input-group input-group-lg">
                <span class="input-group-text">Writer</span>
                <input
                  type="text"
                  name="writer"
                  class="form-control"
                  th:value="${board.writer}"
                  aria-label="Writer"
                  readonly
                />
              </div>

              <div class="mb-3 input-group input-group-lg">
                <span class="input-group-text">RegDate</span>
                <input
                  type="text"
                  name="regDate"
                  class="form-control"
                  th:value="${#temporals.format(board.regDate, 'yyyy-MM-dd')}"
                  aria-label="RegDate"
                  readonly
                />
              </div>

              <div class="float-end">
                <a th:href="@{/board/list}" class="btn btn-info btnList">LIST</a>
                <th:block th:if="${!board.delFlag}">
                  <a th:href="@{|/board/modify/${board.bno}|}" class="btn btn-warning btnModify">
                    MODIFY
                  </a>
                </th:block>
              </div>
            </div>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
