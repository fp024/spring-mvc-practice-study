# Windows JDK 경로: set-jdk-env.bat / build-scripts/generate-toolchains.ps1 에서 사용
JAVA_HOME=C:/JDK/21
# Linux/macOS JDK 경로: set-jdk-env.sh / build-scripts/generate-toolchains.sh 에서 사용
# ~ 와 $HOME 접두어를 쓸 수 있고, 값이 비어 있으면 JAVA_HOME -> 환경변수 JAVA_HOME 순으로 대체한다.
JAVA_HOME_LINUX=$HOME/apps/JDK/21
JDK_VERSION=21
JDK_VENDOR=temurin
APP_NAME=spring-mvc-practice-study
